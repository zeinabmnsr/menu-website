<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bootstrap-5.3.5-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="login.css">
    <title>login</title>
</head>
<body>
    <div class="overlay justify-content-center d-flex">
        <div class="card w-50">
            <img src="images/backgrounds/bgloginfehagreen.png" class="card-img w-25" alt="loginimg">
            <div class="card-body">
                <div class="card-title">
                    LOGIN
                </div>
                <div class="card-text">
                    <div class="form-floating mb-3 mt-3 w-75">
                        <input type="email" class="form-control" id="email" placeholder="email" name="email"></input>
                        <label for="email">Email</label>
                    </div>
                    <div class="form-floating mb-3 mt-3 w-75">
                        <input type="password" class="form-control" id="pswd" placeholder="pswd" name="pswd"></input>
                        <label for="pswd">PASSWORD</label>
                    </div>
                    <label class="form-check-label">
                        <input class="form=check-input" type="checkbox" name="remember">remember me
                    </label>
                    <buttton class="btn btn-danger pt-2 w-50 h-50 d-block">LOGIN</button>
                </div>
            </div>
        </div>
    </div>

    <script src="bootstrap-5.3.5-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
